name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt pyinstaller
      - name: Build EXE
        run: python -m PyInstaller Qball.spec --noconfirm
      - name: Smoke test
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath dist\Qball.exe -ArgumentList "--no-browser" -PassThru
          $h = $null
          foreach ($i in 1..40) {
            try {
              $h = Invoke-RestMethod http://127.0.0.1:8600/api/health -TimeoutSec 2
              if ($h.app -eq "qball") { break }
            } catch { }
            Start-Sleep -Seconds 1
          }
          if (-not $h -or $h.app -ne "qball") { throw "smoke test failed" }
          Write-Host "smoke OK: v$($h.version)"
          Get-Process Qball -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Hash
        shell: pwsh
        run: (Get-FileHash dist\Qball.exe -Algorithm SHA256).Hash.ToLower() | Set-Content dist\Qball.exe.sha256 -Encoding ascii
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Qball.exe
            dist/Qball.exe.sha256
          generate_release_notes: true
      - name: Update version.json
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $sha = (Get-Content dist\Qball.exe.sha256 -Raw).Trim()
          python scripts/update_version.py $ver "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Qball.exe" $sha "小版本更新:安装器与 qball update 会自动拉取本版本"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: version.json -> v$ver"
          git push origin HEAD:main
